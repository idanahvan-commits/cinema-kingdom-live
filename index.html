<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ממלכת התבונה</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#170f26;color:#fff1d1;font:16px Arial,sans-serif}
#district{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#opening{position:fixed;inset:0;display:grid;place-content:center;gap:.65rem;text-align:center;padding:24px;background:#170f26}
#opening[hidden]{display:none}
#opening h1,#opening p{margin:0}
.bsd{position:fixed;top:max(10px,env(safe-area-inset-top));right:13px;font-size:11px}
#opening a{color:#ffdfa2}
</style>
</head>
<body>
<iframe id="district" title="מחוז בממלכת התבונה" allow="fullscreen" allowfullscreen></iframe>
<main id="opening">
 <small class="bsd">בס״ד</small>
 <h1>ממלכת התבונה</h1>
 <p id="status" role="status">פותחים את שערי הממלכה…</p>
 <a id="direct" hidden>פתחו את המחוז ישירות</a>
 <noscript>יש להפעיל JavaScript בדפדפן כדי לפתוח את הממלכה.</noscript>
</main>
<script>
(function(){
 // כדי לשנות את נקודת ההתחלה, בחרו כאן מזהה מתוך DISTRICTS.
 const START_DISTRICT='cinema';
 const DISTRICTS={
  cinema:{title:'ממלכת הקולנוע',file:'./cinema.html',invites:true},
  nasa:{title:'ממלכת נאס״א',file:'./nasa.html'}
 };
 const url=new URL(location.href);
 const invitationKeys=['m','h','host','t','r','room','c'];
 const isInvitation=invitationKeys.some(key=>url.searchParams.has(key));
 const requested=url.searchParams.get('district');
 const entry=isInvitation?Object.keys(DISTRICTS).find(key=>DISTRICTS[key].invites):requested;
 const selected=Object.hasOwn(DISTRICTS,entry)?entry:START_DISTRICT;
 const district=DISTRICTS[selected];
 const target=new URL(district.file,url);
 if(district.invites)for(const key of invitationKeys){
  const value=url.searchParams.get(key);
  if(value!==null)target.searchParams.set(key,value);
 }
 const frame=document.getElementById('district');
 const splash=document.getElementById('opening');
 const status=document.getElementById('status');
 const direct=document.getElementById('direct');
 frame.title=district.title;
 direct.href=target.href;
 direct.target='_top';
 status.textContent='פותחים את '+district.title+'…';
 const timer=setTimeout(()=>{
  status.textContent='פתיחת המחוז מתעכבת.';
  direct.hidden=false;
 },14000);
 frame.addEventListener('load',()=>{
  try{
   if(frame.contentWindow.location.href==='about:blank')return;
   const doc=frame.contentDocument;
   if(doc&&!doc.querySelector('main,canvas,#intro,#scene')&&doc.title!==''){
    status.textContent='המחוז לא נמצא. ודאו שקובץ המחוז נמצא ליד index.html.';
    direct.hidden=false;clearTimeout(timer);return;
   }
  }catch(_){}
  clearTimeout(timer);splash.hidden=true;
 });
 frame.src=target.href;
})();
</script>
</body>
</html>
